<form method="POST" enctype="multipart/form-data" 
      style="max-width:350px;margin:40px auto;padding:20px;border:1px solid #ddd;border-radius:10px;font-family:Arial">

    <h3 style="text-align:center;">Upload Pelamar</h3>

    <input type="text" name="nama" placeholder="Nama"
           style="width:100%;padding:10px;margin-bottom:10px;border:1px solid #ccc;border-radius:5px;box-sizing:border-box;">

    <input type="email" name="email" placeholder="Email"
           style="width:100%;padding:10px;margin-bottom:10px;border:1px solid #ccc;border-radius:5px;box-sizing:border-box;">

    <input type="file" name="gambar"
           style="margin-bottom:15px;">

    <button type="submit"
            style="width:100%;padding:10px;border:none;border-radius:5px;cursor:pointer;">
        Submit
    </button>

</form>
